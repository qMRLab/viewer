[package]
name = "labview"
version = "0.1.0"
edition = "2021"
description = "Browser NIfTI viewer for GBM8360 labs (Rust/WebAssembly core)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nifti = { version = "0.17", features = ["ndarray_volumes"] }
ndarray = "0.16"
flate2 = "1"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
